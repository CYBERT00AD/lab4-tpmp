name: C CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc make libsqlite3-dev sqlite3

      - name: Build
        run: make

      - name: Check
        run: make check
        shell: /usr/bin/bash -e {0}

      - name: Distcheck
        run: make distcheck
        shell: /usr/bin/bash -e {0}